<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Body Problem</title>
</head>
<body>
    <canvas id="simulation-canvas" width="1000" height="1000"></canvas>
    <script>
        const canvas = document.getElementById('simulation-canvas');
        const ctx = canvas.getContext('2d');

        class ThreeBodySimulation {
            constructor(originX = 500, originY = 500) {
                this.originX = originX;
                this.originY = originY;
                this.G = 1.0;
                this.scale = 150.0;

                const x1 = -0.372008640907423;
                const v1 = 1.21800411067968;
                const v2 = 0.4531080538336022;

                this.bodies = [
                    { mass: 1.0, x: x1, y: 0.0, vx: 0.0, vy: v1, color: '#1976d2' },
                    { mass: 1.0, x: 1.0, y: 0.0, vx: 0.0, vy: v2, color: '#ef6c00' },
                    { mass: 1.0, x: 0.0, y: 0.0, vx: 0.0, vy: -(v1 + v2), color: '#388e3c' }
                ];

                this.trails = [[], [], []];
                this.maxTrail = 300;
            }

            step(dt = 0.06) {
                const forces = this.bodies.map(() => ({ fx: 0.0, fy: 0.0 }));

                for (let i = 0; i < this.bodies.length; i++) {
                    for (let j = i + 1; j < this.bodies.length; j++) {
                        const dx = this.bodies[j].x - this.bodies[i].x;
                        const dy = this.bodies[j].y - this.bodies[i].y;

                        let distance = Math.sqrt(dx ** 2 + dy ** 2);
                        if (distance < 1.0) distance = 1.0;

                        const force = this.G * this.bodies[i].mass * this.bodies[j].mass / (distance ** 2);

                        const fx = force * dx / distance;
                        const fy = force * dy / distance;

                        forces[i].fx += fx;
                        forces[i].fy += fy;
                        forces[j].fx -= fx;
                        forces[j].fy -= fy;
                    }
                }

                for (let i = 0; i < this.bodies.length; i++) {
                    const ax = forces[i].fx / this.bodies[i].mass;
                    const ay = forces[i].fy / this.bodies[i].mass;

                    this.bodies[i].vx += ax * dt;
                    this.bodies[i].vy += ay * dt;

                    this.bodies[i].x += this.bodies[i].vx * dt;
                    this.bodies[i].y += this.bodies[i].vy * dt;
                }
            }

            getCoords() {
                return this.bodies.map(body => ({
                    x: this.originX + body.x * this.scale,
                    y: this.originY + body.y * this.scale,
                    color: body.color
                }));
            }

            render() {
                const coords = this.getCoords();

                for (let i = 0; i < coords.length; i++) {
                    this.trails[i].push({ x: coords[i].x, y: coords[i].y });
                    if (this.trails[i].length > this.maxTrail) this.trails[i].shift();
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < coords.length; i++) {
                    if (this.trails[i].length > 1) {
                        ctx.beginPath();
                        ctx.moveTo(this.trails[i][0].x, this.trails[i][0].y);
                        for (let j = 1; j < this.trails[i].length; j++) {
                            ctx.lineTo(this.trails[i][j].x, this.trails[i][j].y);
                        }
                        const hexToRgba = (hex) => {
                            const r = parseInt(hex.slice(1, 3), 16);
                            const g = parseInt(hex.slice(3, 5), 16);
                            const b = parseInt(hex.slice(5, 7), 16);
                            return `rgba(${r},${g},${b},0.7)`;
                        };
                        ctx.strokeStyle = hexToRgba(coords[i].color);
                        ctx.lineWidth = 1.25;
                        ctx.stroke();
                    }
                }

                for (let i = 0; i < coords.length; i++) {
                    ctx.beginPath();
                    ctx.arc(coords[i].x, coords[i].y, 10, 0, 2 * Math.PI);
                    ctx.fillStyle = coords[i].color;
                    ctx.fill();
                    ctx.strokeStyle = '#222';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        const simulation = new ThreeBodySimulation();

        function animate() {
            simulation.step();
            simulation.render();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
