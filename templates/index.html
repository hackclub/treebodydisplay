<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Body Problem</title>
</head>
<body>
    <canvas id="simulation-canvas" width="1000" height="1000" 
            data-origin-x="{{ origin_x }}" data-origin-y="{{ origin_y }}"></canvas>
    <script>
        const canvas = document.getElementById('simulation-canvas');
        const ctx = canvas.getContext('2d');

        const ORIGIN_X = Number(canvas.getAttribute('data-origin-x')) || 300;
        const ORIGIN_Y = Number(canvas.getAttribute('data-origin-y')) || 300;

        function drawBodies(coords) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < coords.length; i++) {
                ctx.beginPath();
                ctx.arc(coords[i].x, coords[i].y, 10, 0, 2 * Math.PI);
                ctx.fillStyle = coords[i].color;
                ctx.fill();
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        let latestCoords = null;
        const trails = [];
        const MAX_TRAIL = 300;

        async function pollCoords() {
            try {
                const response = await fetch('/coords', { cache: 'no-store' });
                if (response.ok) {
                    latestCoords = await response.json();
                }
            } catch (e) {
                // ignore fetch errors
            }
        }

        function animate() {
            if (latestCoords) {
                while (trails.length < latestCoords.length) {
                    trails.push([]);
                }

                for (let i = 0; i < latestCoords.length; i++) {
                    trails[i].push({ x: latestCoords[i].x, y: latestCoords[i].y });
                    if (trails[i].length > MAX_TRAIL) trails[i].shift();
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const drawTrail = (trail, color) => {
                    if (trail.length < 2) return;
                    ctx.beginPath();
                    ctx.moveTo(trail[0].x, trail[0].y);
                    for (let i = 1; i < trail.length; i++) {
                        ctx.lineTo(trail[i].x, trail[i].y);
                    }
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.25;
                    ctx.stroke();
                };

                for (let i = 0; i < latestCoords.length; i++) {
                    const hexToRgba = (hex) => {
                        const r = parseInt(hex.slice(1, 3), 16);
                        const g = parseInt(hex.slice(3, 5), 16);
                        const b = parseInt(hex.slice(5, 7), 16);
                        return `rgba(${r},${g},${b},0.7)`;
                    };
                    drawTrail(trails[i], hexToRgba(latestCoords[i].color));
                }

                drawBodies(latestCoords);
            }
            requestAnimationFrame(animate);
        }

        setInterval(pollCoords, 50);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
